name: Deploy Watch Together Durable Object

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Deploy Durable Object Worker
        working-directory: workers/watch-together
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure Worker secrets
        working-directory: workers/watch-together
        run: |
          printf '%s' '${{ secrets.WATCH_TOGETHER_TOKEN_SECRET }}' | pnpm exec wrangler secret put WATCH_TOGETHER_TOKEN_SECRET
          printf '%s' '${{ secrets.WATCH_TOGETHER_USERS }}' | pnpm exec wrangler secret put WATCH_TOGETHER_USERS
          printf '%s' '${{ secrets.WATCH_TOGETHER_ALLOWED_ORIGINS }}' | pnpm exec wrangler secret put ALLOWED_ORIGINS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
